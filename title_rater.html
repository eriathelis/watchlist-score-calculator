<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор оценки тайтлов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            notion: {
              bgLight: '#ffffff',
              bgDark: '#191919',
              cardLight: '#f7f6f3',
              cardDark: '#252525',
              borderLight: '#e9e8e5',
              borderDark: '#333333',
              textLight: '#37352f',
              textDark: '#rgba(255, 255, 255, 0.81)',
              subtleLight: '#787774',
              subtleDark: '#9b9b9b',
              accent: '#e16d87',
              accentHover: '#c95972'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Hide number input spinners */
    input[type='number']::-webkit-inner-spin-button,
    input[type='number']::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type='number'] {
      -moz-appearance: textfield;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#f7f6f5] dark:bg-[#121212] text-[#37352f] dark:text-[#d3d3d3] min-h-screen p-3 sm:p-6 transition-colors duration-200">

  <div class="max-w-xl mx-auto bg-white dark:bg-[#191919] border border-[#e8e7e3] dark:border-[#2d2d2d] rounded-2xl shadow-sm p-4 sm:p-6">
    
    <!-- Шапка -->
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-[#eee] dark:border-[#2a2a2a]">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-[#222] dark:text-[#f0f0f0] flex items-center gap-2">
          <span>✿</span> Калькулятор оценки
        </h1>
        <p class="text-xs text-[#888] dark:text-[#888] mt-0.5">Шкала от 0 до 10 • Шаг 0.5</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="reset-btn" title="Сбросить все оценки" class="p-2 text-xs text-[#787774] hover:text-[#e16d87] dark:text-[#9b9b9b] dark:hover:text-[#e16d87] transition-colors rounded-lg bg-[#f4f4f2] dark:bg-[#242424] hover:bg-[#eaeae8] dark:hover:bg-[#2d2d2d]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </div>

    <!-- Список категорий и критериев -->
    <div id="criteria-container" class="space-y-6">
      <!-- Динамически заполняется через JS -->
    </div>

    <!-- Итоговая оценка -->
    <div class="mt-8 pt-6 border-t border-[#eee] dark:border-[#2a2a2a]">
      <div class="bg-[#faf9f6] dark:bg-[#202020] border border-[#ebe9e4] dark:border-[#2c2c2c] rounded-xl p-5 text-center shadow-sm">
        <div class="text-xs uppercase tracking-wider font-semibold text-[#888] dark:text-[#888] mb-1">
          ✿ Итоговая оценка
        </div>
        <div id="final-score" class="text-4xl sm:text-5xl font-black text-[#e16d87] tracking-tight my-1">
          7.00
        </div>
        <div id="final-verdict" class="inline-block mt-2 px-3 py-1 rounded-full text-xs sm:text-sm font-medium bg-[#fce7eb] text-[#c95972] dark:bg-[#3a2027] dark:text-[#f39cb0]">
          Нормальный / проходной тайтл
        </div>
      </div>
    </div>

    <!-- Памятка / Аккордеон с интерпретацией -->
    <div class="mt-6 border border-[#eee] dark:border-[#2a2a2a] rounded-xl overflow-hidden">
      <button id="toggle-guide" class="w-full flex justify-between items-center px-4 py-3 bg-[#fafafa] dark:bg-[#202020] text-xs font-semibold text-[#666] dark:text-[#aaa] hover:bg-[#f0f0ed] dark:hover:bg-[#252525] transition-colors">
        <span class="flex items-center gap-1.5">
          <span>✿</span> Интерпретация оценок
        </span>
        <svg id="guide-arrow" class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>
      
      <div id="guide-content" class="hidden px-4 py-3 bg-white dark:bg-[#191919] text-xs space-y-2 text-[#555] dark:text-[#aaa] border-t border-[#eee] dark:border-[#2a2a2a]">
        <div class="flex justify-between items-center border-b border-[#f3f3f0] dark:border-[#252525] pb-1.5">
          <span class="font-bold text-[#e16d87]">10</span>
          <span>Личный шедевр</span>
        </div>
        <div class="flex justify-between items-center border-b border-[#f3f3f0] dark:border-[#252525] pb-1.5">
          <span class="font-bold text-[#e16d87]">9.0 – 9.9</span>
          <span>Очень сильный тайтл</span>
        </div>
        <div class="flex justify-between items-center border-b border-[#f3f3f0] dark:border-[#252525] pb-1.5">
          <span class="font-bold text-[#e16d87]">8.0 – 8.9</span>
          <span>Заметно выше среднего</span>
        </div>
        <div class="flex justify-between items-center border-b border-[#f3f3f0] dark:border-[#252525] pb-1.5">
          <span class="font-bold text-[#e16d87]">7.0 – 7.9</span>
          <span>Нормальный / проходной тайтл</span>
        </div>
        <div class="flex justify-between items-center border-b border-[#f3f3f0] dark:border-[#252525] pb-1.5">
          <span class="font-bold text-[#e16d87]">6.0 – 6.9</span>
          <span>Смотрибельно, но с ощутимыми проблемами</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="font-bold text-[#e16d87]">&lt; 6.0</span>
          <span>Скорее не понравилось</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Структура критериев
    const categories = [
      {
        title: "✦ Сюжет",
        criteria: [
          { id: 1, name: "Глубина и проработка", desc: "Темы, идеи, сценарная логика." },
          { id: 2, name: "Развитие", desc: "Динамика и развитие истории." },
          { id: 3, name: "Оригинальность", desc: "Нетривиальность концепта и подачи." }
        ]
      },
      {
        title: "✦ Аудиовизуал",
        criteria: [
          { id: 4, name: "Рисовка", desc: "Дизайн, анимация, визуальная эстетика." },
          { id: 5, name: "Музыка", desc: "OST, опенинги/эндинги, звуковое сопровождение." }
        ]
      },
      {
        title: "✦ Персонажи",
        criteria: [
          { id: 6, name: "Проработка", desc: "Глубина, мотивация, раскрытие персонажей." },
          { id: 7, name: "Харизма", desc: "Насколько персонажи цепляют и запоминаются." }
        ]
      },
      {
        title: "✦ Общее впечатление",
        criteria: [
          { id: 8, name: "Эмоциональное воздействие", desc: "Насколько тайтл эмоционально зацепил." },
          { id: 9, name: "Послевкусие", desc: "Насколько тайтл остаётся в голове после просмотра." },
          { id: 10, name: "Удержание интереса", desc: "Насколько просмотр был увлекательным на протяжении всего тайтла." }
        ]
      }
    ];

    // Хранилище текущих значений (по умолчанию 7)
    const scores = {};
    categories.forEach(cat => {
      cat.criteria.forEach(c => {
        scores[c.id] = 7.0;
      });
    });

    // Отрисовка приложения
    function renderApp() {
      const container = document.getElementById('criteria-container');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catElem = document.createElement('div');
        catElem.className = 'space-y-2.5';

        const catTitle = document.createElement('h2');
        catTitle.className = 'text-sm font-semibold text-[#444] dark:text-[#bbb] border-b border-[#f0efe9] dark:border-[#272727] pb-1';
        catTitle.innerText = cat.title;
        catElem.appendChild(catTitle);

        cat.criteria.forEach(item => {
          const row = document.createElement('div');
          row.className = 'flex flex-col bg-[#fafaf8] dark:bg-[#202020] p-2.5 rounded-xl border border-[#edebe6] dark:border-[#2b2b2b] transition-all hover:border-[#e0ded8] dark:hover:border-[#353535]';

          row.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-medium text-[#777] dark:text-[#777] shrink-0">${item.id}.</span>
                <span class="text-xs sm:text-sm font-medium text-[#222] dark:text-[#eee] truncate">${item.name}</span>
                <button type="button" class="info-btn shrink-0 p-1 text-[#a0a09c] hover:text-[#e16d87] dark:text-[#666] dark:hover:text-[#e16d87] transition-colors focus:outline-none" data-id="${item.id}">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                  </svg>
                </button>
              </div>

              <div class="flex items-center gap-1 shrink-0">
                <button type="button" class="minus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-white dark:bg-[#2a2a2a] border border-[#e2e0d9] dark:border-[#383838] text-[#444] dark:text-[#ccc] hover:bg-[#f0ede6] dark:hover:bg-[#333] font-bold text-sm transition-colors active:scale-95" data-id="${item.id}">-</button>
                
                <input type="number" 
                       step="0.5" 
                       min="0" 
                       max="10" 
                       value="${scores[item.id]}" 
                       data-id="${item.id}" 
                       class="score-input w-11 h-7 text-center text-xs sm:text-sm font-bold bg-white dark:bg-[#2a2a2a] border border-[#e2e0d9] dark:border-[#383838] rounded-lg text-[#e16d87] focus:outline-none focus:ring-1 focus:ring-[#e16d87]">
                
                <button type="button" class="plus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-white dark:bg-[#2a2a2a] border border-[#e2e0d9] dark:border-[#383838] text-[#444] dark:text-[#ccc] hover:bg-[#f0ede6] dark:hover:bg-[#333] font-bold text-sm transition-colors active:scale-95" data-id="${item.id}">+</button>
              </div>
            </div>
            
            <div id="desc-${item.id}" class="hidden mt-2 pt-2 border-t border-[#eee] dark:border-[#2a2a2a] text-[11px] text-[#787774] dark:text-[#999] leading-tight">
              ${item.desc}
            </div>
          `;

          catElem.appendChild(row);
        });

        container.appendChild(catElem);
      });

      attachEvents();
      calculateTotal();
    }

    // Навешивание событий на интерактивные элементы
    function attachEvents() {
      // Иконки информации (toggle описания)
      document.querySelectorAll('.info-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const descElem = document.getElementById(`desc-${id}`);
          descElem.classList.toggle('hidden');
        });
      });

      // Кнопка "-"
      document.querySelectorAll('.minus-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          let val = parseFloat(scores[id]) || 0;
          if (val > 0) {
            val = Math.max(0, val - 0.5);
            scores[id] = val;
            updateInput(id, val);
            calculateTotal();
          }
        });
      });

      // Кнопка "+"
      document.querySelectorAll('.plus-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          let val = parseFloat(scores[id]) || 0;
          if (val < 10) {
            val = Math.min(10, val + 0.5);
            scores[id] = val;
            updateInput(id, val);
            calculateTotal();
          }
        });
      });

      // Ручной ввод числа
      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          let val = parseFloat(e.target.value);
          if (isNaN(val)) val = 0;
          if (val < 0) val = 0;
          if (val > 10) val = 10;
          scores[id] = val;
          e.target.value = val;
          calculateTotal();
        });
      });
    }

    // Вспомогательная функция обновления value поля
    function updateInput(id, value) {
      const input = document.querySelector(`.score-input[data-id="${id}"]`);
      if (input) input.value = value;
    }

    // Расчет итогового балла и вердикта
    function calculateTotal() {
      const keys = Object.keys(scores);
      const totalSum = keys.reduce((acc, key) => acc + scores[key], 0);
      const avg = totalSum / keys.length;
      
      const formatted = avg.toFixed(2);
      document.getElementById('final-score').innerText = formatted;

      // Определение вердикта
      const verdictElem = document.getElementById('final-verdict');
      let verdict = "";
      
      if (avg === 10) {
        verdict = "Личный шедевр";
      } else if (avg >= 9.0) {
        verdict = "Очень сильный тайтл";
      } else if (avg >= 8.0) {
        verdict = "Заметно выше среднего";
      } else if (avg >= 7.0) {
        verdict = "Нормальный / проходной тайтл";
      } else if (avg >= 6.0) {
        verdict = "Смотрибельно, но с ощутимыми проблемами";
      } else {
        verdict = "Скорее не понравилось";
      }

      verdictElem.innerText = verdict;
    }

    // Сброс всех значений на 7
    document.getElementById('reset-btn').addEventListener('click', () => {
      Object.keys(scores).forEach(id => {
        scores[id] = 7.0;
        updateInput(id, 7.0);
      });
      calculateTotal();
    });

    // Переключение отображения памятки оценок
    const toggleGuide = document.getElementById('toggle-guide');
    const guideContent = document.getElementById('guide-content');
    const guideArrow = document.getElementById('guide-arrow');

    toggleGuide.addEventListener('click', () => {
      guideContent.classList.toggle('hidden');
      guideArrow.classList.toggle('rotate-180');
    });

    // Инициализация при старте
    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
